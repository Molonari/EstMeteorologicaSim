server {
    listen 80;

    # archivos estaticos (la pagina)
    root /usr/share/nginx/html;
    index index.html;

    # todo lo que empiece con /api/ se reenvia al backend
    # "backend" es el nombre del servicio en la red de Compose
    location /api/ {
        proxy_pass http://backend:5000;
    }
}
